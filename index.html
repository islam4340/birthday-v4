<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="loader">
<h1>🎂</h1>
<p>Loading your surprise...</p>
</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div id="slideshow">

<img src="photo1.jpg" class="slide active">

<img src="photo2.jpg" class="slide">

<img src="photo3.jpg" class="slide">

<img src="photo4.jpg" class="slide">

<img src="photo5.jpg" class="slide">

</div>

<div id="overlay">

<div class="glass">

<h1>🎉 Happy Birthday 🎉</h1>

<h2>প্রিয় বউজান ❤️</h2>

<p id="message">

তোমার জীবনের প্রতিটি দিন সুখ, শান্তি, সুস্বাস্থ্য আর অফুরন্ত হাসিতে ভরে উঠুক।
আল্লাহ তোমার সব ভালো ইচ্ছা পূরণ করুন।
তুমি সবসময় এভাবেই হাসিখুশি থেকো।
শুভ জন্মদিন! ❤️

</p>

<button id="start">

🎁 Surprise Open

</button>

<h3>

❤️ তোমার জামাই ❤️

</h3>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
